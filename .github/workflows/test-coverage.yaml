on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

name: test-coverage

jobs:
  test-coverage:
    if: "!contains(github.event.commits[0].message, '[skip-ci]')"
    runs-on: macOS-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr

      - name: Test coverage
        run: |
          out <- tryCatch(covr::codecov(), error = function(e) e)
          if (inherits(out, "error")) {
            cat("\n========== covr failed; surfacing testthat.Rout.fail ==========\n")
            failPath <- regmatches(conditionMessage(out),
              regexpr("/[^`]*testthat\\.Rout\\.fail", conditionMessage(out)))
            if (length(failPath) && file.exists(failPath)) {
              cat(readLines(failPath), sep = "\n")
            } else {
              cat("(could not locate .Rout.fail; raw error follows)\n",
                  conditionMessage(out), "\n", sep = "")
            }
            stop(conditionMessage(out), call. = FALSE)
          }
        shell: Rscript {0}
