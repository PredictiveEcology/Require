on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

name: test-coverage

jobs:
  test-coverage:
    if: "!contains(github.event.commits[0].message, '[skip-ci]')"
    runs-on: macOS-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr

      - name: Test coverage
        run: |
          ## Run tests directly first so failures surface with names; covr
          ## otherwise hides them inside a temp .Rout.fail it then deletes.
          ## pkgload is in covr's own deps so it's reliably present here.
          pkgload::load_all()
          testthat::test_local(reporter = "summary")
          covr::codecov()
        shell: Rscript {0}
